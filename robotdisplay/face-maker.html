<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Maker – FLEXI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #f0f4ff; font-family: Arial, Helvetica, sans-serif; color: #222;
      display: flex; flex-direction: column; gap: 10px; padding: 12px;
    }
    button { font-family: inherit; cursor: pointer; }

    /* ── Start from ── */
    #templatesRow { display: flex; align-items: center; gap: 10px; }
    #templatesRow .row-title { font-weight: bold; color: #6b7a99; white-space: nowrap; }
    #templates { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }
    .template {
      flex: 0 0 auto; width: 78px; height: 52px; padding: 0; border: 3px solid transparent;
      border-radius: 12px; background: none; overflow: hidden;
    }
    .template svg { display: block; width: 100%; height: 100%; }
    .template:active { border-color: #1a56a0; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 8px; }
    .tab {
      flex: 1; padding: 14px 8px; border: none; border-radius: 16px 16px 0 0;
      background: #dfe7fb; color: #1a56a0; font-size: 1.3rem; font-weight: bold;
    }
    .tab.active { background: white; box-shadow: 0 -2px 10px rgba(26,86,160,.08); }

    /* ── Controls ── */
    #panel {
      flex: 1; min-height: 0; overflow-y: auto; background: white;
      border-radius: 0 0 18px 18px; padding: 16px 18px; margin-top: -10px;
    }
    .control-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
    .control-row + .control-row { border-top: 1px solid #eef1f8; }
    .control-label { flex: 0 0 130px; font-size: 1.15rem; font-weight: bold; color: #333; }
    .control-body { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    .swatch {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid #dde3f0; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6);
    }
    .swatch.selected { border-color: #1a56a0; transform: scale(1.12); box-shadow: 0 0 0 3px #9dbcf5; }

    .choice {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 96px; padding: 8px 12px; border: 3px solid #dde3f0; border-radius: 14px;
      background: white; font-size: 1rem; font-weight: bold; color: #1a56a0;
    }
    .choice.small { min-width: 80px; padding: 12px; font-size: 1.05rem; }
    .choice.selected { border-color: #1a56a0; background: #e8f0ff; }

    .step-btn {
      width: 60px; height: 52px; border: none; border-radius: 14px;
      background: #1a56a0; color: white; font-size: 1.7rem; font-weight: bold;
    }
    .step-btn:disabled { background: #c9d4ea; cursor: default; }
    .step-bar { flex: 1; max-width: 260px; height: 14px; border-radius: 7px; background: #e3e9f6; overflow: hidden; }
    .step-bar div { height: 100%; background: #2bb3a3; border-radius: 7px; }

    /* ── Bottom buttons ── */
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .action {
      padding: 14px 22px; border: none; border-radius: 22px;
      font-size: 1.15rem; font-weight: bold;
    }
    .action.light { background: #dfe7fb; color: #1a56a0; }
    .action.save  { background: #2bb3a3; color: white; min-width: 210px; }

    @media (max-width: 640px) {
      .control-label { flex-basis: 96px; font-size: 1rem; }
      .swatch { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>

  <div id="templatesRow" style="display:none;">
    <span class="row-title">Start from:</span>
    <div id="templates"></div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="colours" onclick="showTab('colours')">🎨 Colours</button>
    <button type="button" class="tab" data-tab="eyes" onclick="showTab('eyes')">👀 Eyes</button>
    <button type="button" class="tab" data-tab="mouth" onclick="showTab('mouth')">👄 Mouth</button>
  </div>

  <div id="panel"></div>

  <div class="actions">
    <button type="button" class="action light" onclick="startAgain()">↺ Start again</button>
    <button type="button" class="action light" onclick="surpriseMe()">🎲 Surprise me</button>
    <button type="button" class="action save" id="saveBtn" onclick="saveFace()">💾 Save my face</button>
  </div>

  <script src="scripts/config.js"></script>
  <script src="../databasejs/scripts/database.js"></script>
  <script src="scripts/face-shared.js"></script>
  <script src="scripts/face-maker.js"></script>
  <script src="scripts/kiosk.js" data-frame-only></script>
</body>
</html>
