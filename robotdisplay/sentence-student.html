<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sentence Ordering Activity</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #eef2ff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 30px;
    }

    /* ── Waiting screen ── */
    #waitingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #888;
      text-align: center;
      padding: 40px;
    }
    #waitingScreen .wait-icon, .center-screen .wait-icon { font-size: 4rem; margin-bottom: 16px; }
    #waitingScreen .wait-msg, .center-screen .wait-msg  { font-size: 1.4rem; color: #888; }
    .wait-title { font-size: 2.2rem; font-weight: bold; color: #1a56a0; margin-bottom: 8px; }

    /* ── Lesson: intro / reflection / finished ── */
    .center-screen {
      flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 32px 20px;
    }
    .message-card {
      background: white; border-radius: 24px; padding: 32px 36px; max-width: 640px; width: 100%;
      box-shadow: 0 6px 30px rgba(26,86,160,.12);
    }
    .message-title { font-size: 2rem; font-weight: bold; color: #222; margin-bottom: 16px; }
    .message-image { max-width: 100%; max-height: 40vh; border-radius: 16px; margin-bottom: 16px; }
    .message-text  { font-size: 1.5rem; line-height: 1.5; color: #333; margin-bottom: 28px; white-space: pre-wrap; }
    .lesson-progress { font-size: 0.95rem; color: #6b7a99; font-weight: bold; margin-bottom: 10px; }
    .lesson-progress:empty { display: none; }

    #activityScreen { display: none; }

    /* ── Lesson: design a scene (scene-builder.js) ── */
    #sceneScreen {
      display: none; flex-direction: column;
      height: 100vh; padding: 12px 16px 14px; gap: 8px;
    }
    .scene-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .scene-tools .gap { width: 14px; }
    .tool-btn {
      padding: 10px 16px; border: 3px solid #dde3f0; border-radius: 14px; background: white;
      font: bold 1.05rem Arial, Helvetica, sans-serif; color: #1a56a0; cursor: pointer;
    }
    .tool-btn.active { border-color: #1a56a0; background: #e8f0ff; }
    #scenePalette, #sceneSelection, #sceneDrawTools { display: flex; align-items: center; gap: 8px; }
    .pen-colour { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #dde3f0; cursor: pointer; }
    .pen-colour.selected { border-color: #1a56a0; transform: scale(1.15); }
    #sceneWrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #scene {
      position: relative; overflow: hidden; border-radius: 18px; touch-action: none;
      box-shadow: 0 6px 30px rgba(26,86,160,.15);
    }
    #sceneBg {
      position: absolute; inset: 0; background: linear-gradient(#bfe3ff, #e8f6ff 60%, #b9e6a5 60%);
      background-size: cover; background-position: center;
    }
    #sceneStickers { position: absolute; inset: 0; pointer-events: none; }
    .scene-sticker {
      position: absolute; transform: translate(-50%, -50%); pointer-events: auto;
      touch-action: none; user-select: none; -webkit-user-drag: none; cursor: grab;
    }
    .scene-sticker.selected { outline: 4px dashed #1a56a0; outline-offset: 4px; border-radius: 6px; }
    #sceneCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #sceneTray {
      display: flex; gap: 10px; overflow-x: auto; justify-content: center;
      background: white; border-radius: 16px; padding: 8px;
    }
    .tray-item {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
      border: 3px solid #dde3f0; border-radius: 14px; background: #f7f9ff; padding: 6px;
      touch-action: none; cursor: grab; font: bold 0.85rem Arial, Helvetica, sans-serif; color: #333;
    }
    .tray-item img { height: 76px; max-width: 120px; object-fit: contain; pointer-events: none; }
    .tray-item span:empty { display: none; }
    .sticker-ghost {
      position: fixed; transform: translate(-50%, -50%); pointer-events: none;
      z-index: 2000; opacity: 0.85;
    }

    /* ── Lesson: design FLEXI's face (face-maker.html, embedded) ── */
    #faceScreen {
      display: none; flex-direction: column;
      height: 100vh; padding: 14px 16px 16px; gap: 10px;
    }
    .face-step-head { text-align: center; }
    .face-step-head .lesson-progress { margin-bottom: 4px; }
    .face-step-title { font-size: 1.6rem; font-weight: bold; color: #222; }
    .face-step-text  { font-size: 1.15rem; color: #333; margin-top: 4px; white-space: pre-wrap; }
    .face-step-text:empty { display: none; }
    #faceEditorFrame {
      flex: 1; width: 100%; min-height: 0;
      border: none; border-radius: 18px; background: #f0f4ff;
      box-shadow: 0 6px 30px rgba(26,86,160,.12);
    }
    .face-step-foot { text-align: center; }

    /* ── Header ── */
    .activity-header {
      text-align: center;
      padding: 24px 20px 12px;
    }
    .activity-title {
      font-size: 2rem;
      font-weight: bold;
      color: #1a56a0;
      margin-bottom: 6px;
    }
    .activity-instruction {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 10px;
    }
    .level-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 14px;
      background: #1a56a0;
      color: white;
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* ── Answer zone ── */
    .answer-zone {
      max-width: 900px;
      margin: 16px auto 8px;
      padding: 0 16px;
    }
    .zone-label {
      font-size: 0.78rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 8px;
    }
    .answer-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: stretch;
      background: white;
      border: 2px dashed #9dbcf5;
      border-radius: 16px;
      padding: 14px 16px;
      min-height: 80px;
    }
    .answer-slots.drag-over-zone {
      border-color: #1a56a0;
      background: #f0f5ff;
    }

    .answer-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      min-height: 62px;
      border: 2px dashed #c5d5f0;
      border-radius: 12px;
      padding: 6px 10px;
      background: #f7f9ff;
      transition: border-color 0.15s, background 0.15s;
    }
    .answer-slot.drag-over {
      border-color: #1a56a0;
      background: #ddeaff;
      transform: scale(1.03);
    }
    .answer-slot.filled {
      border-style: solid;
      border-color: #1a56a0;
      background: white;
      cursor: pointer;
    }
    .answer-slot.filled:hover {
      border-color: #e74c3c;
      background: #fff5f5;
    }
    .slot-num {
      font-size: 0.7rem;
      font-weight: bold;
      color: #bbb;
      position: absolute;
      top: 4px;
      left: 7px;
    }
    .slot-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding-top: 8px;
    }
    .slot-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a1a2e;
      text-align: center;
      line-height: 1.3;
    }
    .slot-img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
    }
    .slot-speak {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 50%;
      color: #1a56a0;
      line-height: 1;
    }
    .slot-speak:hover { background: #e8f0ff; }
    .slot-empty-hint {
      color: #ccc;
      font-size: 1.4rem;
      user-select: none;
    }

    /* ── Word bank ── */
    .word-bank {
      max-width: 900px;
      margin: 16px auto 0;
      padding: 0 16px;
    }
    .bank-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      background: white;
      border: 2px solid #dde3f5;
      border-radius: 16px;
      padding: 16px;
      min-height: 80px;
    }
    .bank-items.drag-over-zone {
      border-color: #aaa;
      background: #f5f5f5;
    }
    .bank-empty-hint {
      color: #ccc;
      font-size: 1rem;
      font-style: italic;
    }

    .bank-bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a56a0;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
      box-shadow: 0 3px 8px rgba(26,86,160,.3);
    }
    .bank-bubble:active { cursor: grabbing; }
    .bank-bubble.dragging { opacity: 0.35; transform: scale(0.95); }
    .bank-bubble:hover { background: #154583; transform: translateY(-2px); box-shadow: 0 5px 14px rgba(26,86,160,.4); }

    .bubble-img {
      width: 38px;
      height: 38px;
      object-fit: cover;
      border-radius: 6px;
    }
    .bubble-speak {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .bubble-speak:hover { background: rgba(255,255,255,0.35); }

    /* ── Action bar ── */
    .action-bar {
      text-align: center;
      padding: 20px 16px 10px;
    }
    .check-btn {
      background: #1a56a0;
      color: white;
      border: none;
      border-radius: 34px;
      padding: 16px 56px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26,86,160,.35);
      transition: all 0.15s;
    }
    .check-btn:hover  { background: #154583; transform: translateY(-2px); }
    .check-btn:active { transform: translateY(0); }
    .check-btn:disabled { background: #aab; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Feedback overlay ── */
    .feedback-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 900;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .feedback-overlay.show  { opacity: 1; pointer-events: all; }
    .overlay-correct { background: rgba(20,110,60,.88); }
    .overlay-stuck   { background: rgba(70,70,80,.88); }

    .feedback-card {
      background: white;
      border-radius: 24px;
      padding: 36px 48px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,.3);
    }
    .fb-emoji { font-size: 4.5rem; margin-bottom: 12px; }
    .fb-title { font-size: 1.9rem; font-weight: bold; color: #222; margin-bottom: 8px; }
    .fb-sub   { font-size: 1.1rem; color: #555; margin-bottom: 24px; }
    .fb-btn {
      border: none; border-radius: 24px;
      padding: 13px 38px;
      font-size: 1.1rem; font-weight: bold;
      cursor: pointer; transition: all 0.15s;
    }
    .fb-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-continue { background: #1a56a0; color: white; }
    .btn-tryagain { background: #f39c12; color: white; }
    .fb-wait {
      font-size: 0.95rem;
      color: #888;
      margin-top: 4px;
      display: none;
    }
    @keyframes waitPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .fb-wait { animation: waitPulse 2s ease-in-out infinite; }

    /* ── Correct/incorrect flash on slots ── */
    .answer-slot.state-correct   { border-color: #1a7a4a !important; background: #eafaf1 !important; }
    .answer-slot.state-incorrect {
      border-color: #c0392b !important; background: #fdf2f2 !important;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .bank-bubble.selected { outline: 3px solid #f39c12; outline-offset: 1px; }

    /* ── Sorting screen ── */
    .sort-bins {
      max-width: 900px;
      margin: 16px auto 8px;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .sort-bin {
      flex: 1 1 220px;
      max-width: 320px;
      background: white;
      border: 2px dashed #9dbcf5;
      border-radius: 16px;
      padding: 12px;
      min-height: 120px;
      transition: border-color 0.15s, background 0.15s;
    }
    .sort-bin.drag-over { border-color: #1a56a0; background: #f0f5ff; }
    .sort-bin-label {
      text-align: center;
      font-weight: bold;
      color: #1a56a0;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .sort-bin-label img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
    .sort-bin-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 40px; }
    .sort-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #eef4ff;
      border: 2px solid #1a56a0;
      color: #1a1a2e;
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .sort-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 6px; }

    /* ── Multiple choice screen ── */
    .mc-question { max-width: 700px; margin: 0 auto 18px; padding: 0 16px; text-align: center; }
    .mc-question-text { font-size: 1.3rem; color: #333; margin-bottom: 8px; }
    .mc-question img { max-width: 220px; max-height: 220px; object-fit: cover; border-radius: 12px; margin-top: 8px; }
    .mc-options { max-width: 700px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .mc-option {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border: 2px solid #dde3f5;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a1a2e;
      transition: all 0.12s;
    }
    .mc-option:hover { border-color: #9dbcf5; background: #f7f9ff; }
    .mc-option.selected { border-color: #1a56a0; background: #eef4ff; }
    .mc-option img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }

    /* ── Picture size the teacher picked for the task (body[data-pictures]) ── */
    body[data-pictures="large"] .slot-img,
    body[data-pictures="large"] .bubble-img          { width: 96px;  height: 96px;  border-radius: 12px; }
    body[data-pictures="large"] .sort-chip img       { width: 72px;  height: 72px;  border-radius: 10px; }
    body[data-pictures="large"] .sort-bin-label img  { width: 88px;  height: 88px;  border-radius: 12px; }
    body[data-pictures="large"] .mc-option img       { width: 110px; height: 110px; border-radius: 12px; }
    body[data-pictures="large"] .mc-question img     { max-width: 420px; max-height: 38vh; }
    body[data-pictures="large"] .message-image       { max-height: 50vh; }

    body[data-pictures="xlarge"] .slot-img,
    body[data-pictures="xlarge"] .bubble-img         { width: 160px; height: 160px; border-radius: 16px; }
    body[data-pictures="xlarge"] .sort-chip img      { width: 120px; height: 120px; border-radius: 14px; }
    body[data-pictures="xlarge"] .sort-bin-label img { width: 130px; height: 130px; border-radius: 16px; }
    body[data-pictures="xlarge"] .mc-option img      { width: 170px; height: 170px; border-radius: 16px; }
    body[data-pictures="xlarge"] .mc-question img    { max-width: 92%; max-height: 52vh; object-fit: contain; }
    body[data-pictures="xlarge"] .message-image      { max-height: 64vh; }
    body[data-pictures="xlarge"] .message-card       { max-width: 960px; }
    body[data-pictures="xlarge"] .answer-zone,
    body[data-pictures="xlarge"] .word-bank,
    body[data-pictures="xlarge"] .sort-bins          { max-width: 1300px; }
    body[data-pictures="xlarge"] .sort-bin           { max-width: 440px; }
    body[data-pictures="xlarge"] .mc-question,
    body[data-pictures="xlarge"] .mc-options         { max-width: 1100px; }
    .mc-check {
      width: 24px; height: 24px;
      border: 2px solid #9dbcf5;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: white;
    }
    .mc-option.selected .mc-check { background: #1a56a0; border-color: #1a56a0; }

    @media (max-width: 600px) {
      .activity-title { font-size: 1.5rem; }
      .activity-instruction { font-size: 1.1rem; }
      .bank-bubble { font-size: 1rem; padding: 8px 12px; }
      .check-btn { font-size: 1.2rem; padding: 14px 36px; }
      .feedback-card { padding: 28px 24px; }
    }

    /* ── Tap to start: shown when the browser blocks speech until a tap ── */
    #tapToStart {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(238, 242, 255, 0.94);
      align-items: center;
      justify-content: center;
    }
    #tapToStart.show { display: flex; }
    #tapToStart button {
      font: bold 2rem Arial, Helvetica, sans-serif;
      color: white;
      background: #1a56a0;
      border: none;
      border-radius: 24px;
      padding: 32px 56px;
      box-shadow: 0 6px 20px rgba(26, 86, 160, 0.35);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="tapToStart">
    <button type="button" id="tapToStartBtn">&#128266; Tap to start</button>
  </div>

  <div id="waitingScreen">
    <div class="wait-icon">🤖</div>
    <div class="wait-title">Hi, I'm FLEXI!</div>
    <div class="wait-msg">Waiting for your teacher…</div>
  </div>

  <!-- Lesson: intro / reflection step -->
  <div id="messageScreen" class="center-screen" style="display:none;">
    <div class="lesson-progress" id="messageProgress"></div>
    <div class="message-card">
      <div class="message-title" id="messageTitle"></div>
      <img class="message-image" id="messageImage" alt="" style="display:none;">
      <div class="message-text" id="messageText"></div>
      <button class="fb-btn btn-continue" id="messageBtn" onclick="onMessageNext()">Next ➜</button>
    </div>
  </div>

  <!-- Lesson: design a scene (e.g. a playground); see scene-builder.js -->
  <div id="sceneScreen">
    <div class="face-step-head">
      <div class="lesson-progress" id="sceneProgress"></div>
      <div class="face-step-title" id="sceneTitle"></div>
      <div class="face-step-text" id="sceneText"></div>
    </div>
    <div class="scene-tools">
      <button type="button" class="tool-btn active" id="sceneMoveBtn">✋ Move</button>
      <span id="sceneDrawTools">
        <button type="button" class="tool-btn" id="sceneDrawBtn">✏️ Draw</button>
        <span id="scenePalette" style="display:none;"></span>
        <button type="button" class="tool-btn" id="sceneUndoBtn">↶ Undo</button>
        <button type="button" class="tool-btn" id="sceneClearBtn">🧽 Clear</button>
      </span>
      <span id="sceneSelection" style="display:none;">
        <span class="gap"></span>
        <button type="button" class="tool-btn" id="sceneSmallerBtn">➖ Smaller</button>
        <button type="button" class="tool-btn" id="sceneBiggerBtn">➕ Bigger</button>
        <button type="button" class="tool-btn" id="sceneRemoveBtn">🗑 Remove</button>
      </span>
    </div>
    <div id="sceneWrap">
      <div id="scene">
        <div id="sceneBg"></div>
        <div id="sceneStickers"></div>
        <canvas id="sceneCanvas"></canvas>
      </div>
    </div>
    <div id="sceneTray"></div>
    <div class="face-step-foot">
      <button class="fb-btn btn-continue" id="sceneBtn" onclick="onSceneNext()">Next ➜</button>
    </div>
  </div>

  <!-- Lesson: design FLEXI's face; FLEXI's face changes live as they edit -->
  <div id="faceScreen">
    <div class="face-step-head">
      <div class="lesson-progress" id="faceProgress"></div>
      <div class="face-step-title" id="faceTitle"></div>
      <div class="face-step-text" id="faceText"></div>
    </div>
    <iframe id="faceEditorFrame" title="Face maker"></iframe>
    <div class="face-step-foot">
      <button class="fb-btn btn-continue" id="faceBtn" onclick="onFaceNext()">Next ➜</button>
    </div>
  </div>

  <!-- Lesson: all steps done -->
  <div id="finishedScreen" class="center-screen" style="display:none;">
    <div class="wait-icon">🎉</div>
    <div class="wait-title">Great work!</div>
    <div class="wait-msg">You finished the lesson.</div>
  </div>

  <div id="activityScreen">

    <div class="activity-header">
      <div class="lesson-progress" id="activityProgress"></div>
      <div class="activity-title" id="activityTitle"></div>
      <div class="activity-instruction" id="activityInstruction"></div>
      <span class="level-badge" id="levelBadge">Sentence</span>
    </div>

    <!-- ═══ Ordering ═══ -->
    <div id="orderingScreen">
      <!-- Answer zone (drop targets) -->
      <div class="answer-zone">
        <div class="zone-label">Put them in order here ↓</div>
        <div class="answer-slots" id="answerSlots"></div>
      </div>

      <!-- Word bank (draggable bubbles) -->
      <div class="word-bank">
        <div class="zone-label">Word Bank — tap or drag a bubble up ↑</div>
        <div class="bank-items" id="bankItems"></div>
      </div>
    </div>

    <!-- ═══ Sorting ═══ -->
    <div id="sortingScreen" style="display:none;">
      <div class="sort-bins" id="sortBins"></div>
      <div class="word-bank">
        <div class="zone-label">Item Bank — tap a bubble, then tap a bin (or drag it in) ↑</div>
        <div class="bank-items" id="sortBank"></div>
      </div>
    </div>

    <!-- ═══ Multiple Choice ═══ -->
    <div id="mcScreen" style="display:none;">
      <div class="mc-question" id="mcQuestionBox"></div>
      <div class="mc-options" id="mcOptionsBox"></div>
    </div>

    <div class="action-bar">
      <button class="check-btn" id="checkBtn" onclick="checkAnswer()" disabled>✓ Check Answer</button>
    </div>

  </div>

  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-card">
      <div class="fb-emoji" id="fbEmoji"></div>
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-sub"   id="fbSub"></div>
      <button class="fb-btn" id="fbBtn" onclick="onFeedbackBtn()"></button>
      <div class="fb-wait" id="fbWait">⏳ Waiting for your teacher…</div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="../databasejs/scripts/database.js"></script>
  <script src="scripts/robot-voice.js"></script>
  <script src="scripts/scene-builder.js"></script>
  <script src="scripts/sentence-student.js"></script>
  <script src="scripts/kiosk.js" data-frame-only></script>
</body>
</html>
