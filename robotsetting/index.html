<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Materials – FLEXI Educational Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8edf2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      color: #111827;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 40px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .topbar-links { display: flex; gap: 10px; }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 8px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #374151;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-home:hover {
      background: #e2e8f0;
      color: #111827;
      text-decoration: none;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 48px 40px 40px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .hero { margin-bottom: 12px; }
    .hero h1 { font-size: 3rem; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .hero p { font-size: 1.35rem; color: #6b7280; margin: 0; }

    /* Robot selector bar */
    .selector-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1px solid #e0e6ed;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 24px 0 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .selector-bar label { font-size: 1rem; font-weight: 600; color: #374151; margin: 0; white-space: nowrap; }
    .selector-bar .btn-group .btn {
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      color: #111827;
      padding: 8px 18px;
    }
    .selector-bar .btn-group .btn:hover { background: #f0f4f8; }

    /* Toolbar: breadcrumb + New button */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .breadcrumb { font-size: 1.15rem; }
    .crumb { cursor: pointer; color: #1a56a0; }
    .crumb:hover { text-decoration: underline; }
    .crumb.current { color: #111827; font-weight: 700; cursor: default; text-decoration: none; }
    .crumb-sep { margin: 0 8px; color: #9ca3af; }

    .new-btn-wrap { position: relative; }
    .btn-new {
      background: #1a56a0;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-new:hover { background: #154583; }

    .new-menu-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      min-width: 210px;
      overflow: hidden;
      z-index: 20;
    }
    .new-menu-dropdown.open { display: block; }
    .new-menu-dropdown button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      background: none;
      border: none;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .new-menu-dropdown button:hover { background: #f1f5f9; }

    /* Library grid */
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .lib-tile {
      position: relative;
      background: #fff;
      border: 1px solid #e8ecf0;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .lib-tile:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.1); transform: translateY(-1px); }

    .lib-tile-body { padding: 26px 12px 16px; text-align: center; cursor: pointer; user-select: none; }
    .lib-tile-icon { font-size: 2.4rem; margin-bottom: 10px; }
    .lib-tile-name { font-size: 0.92rem; font-weight: 600; color: #1f2937; overflow-wrap: break-word; }

    .lib-tile-menu-wrap { position: absolute; top: 6px; right: 6px; }
    .lib-tile-menu-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      line-height: 1;
      color: #9ca3af;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    .lib-tile-menu-btn:hover { background: #f1f5f9; color: #374151; }

    .lib-tile-menu-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 30px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      min-width: 130px;
      overflow: hidden;
      z-index: 10;
    }
    .lib-tile-menu-dropdown.open { display: block; }
    .lib-tile-menu-dropdown button {
      display: block;
      width: 100%;
      padding: 9px 14px;
      background: none;
      border: none;
      text-align: left;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .lib-tile-menu-dropdown button:hover { background: #f1f5f9; }
    .lib-tile-menu-dropdown button.danger { color: #dc2626; }

    /* Empty state */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 90px 20px;
      color: #9ca3af;
      text-align: center;
      gap: 6px;
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 8px; }

    /* Material type modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,0.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      padding: 26px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-card h3 { margin: 0 0 16px; font-size: 1.3rem; color: #111827; }
    .material-type-option {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      margin-bottom: 10px;
      text-align: left;
    }
    .material-type-option:hover { border-color: #1a56a0; background: #f5f8ff; }
    .material-type-icon { font-size: 1.8rem; }
    .material-type-label { display: block; font-weight: 700; color: #111827; }
    .material-type-desc { display: block; font-size: 0.82rem; color: #6b7280; margin-top: 2px; }
    .modal-close {
      margin-top: 6px;
      background: #f1f5f9;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .footer { padding: 30px 0 0; color: #9ca3af; font-size: 0.82rem; text-align: center; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 2rem; }
      .page-wrapper { padding: 32px 20px 28px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="btn-home" href="../index.html">&#8592; Home</a>
    <div class="topbar-links">
      <a class="btn-home" href="tools.html" id="toolsLink">&#128736; Tools</a>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="hero">
      <h1>My Materials</h1>
      <p>Create and organize your lesson materials</p>
    </div>

    <!-- Robot selector -->
    <div class="selector-bar">
      <label>Select robot:</label>
      <div class="btn-group">
        <button class="btn dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <span id="selectedRobot">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span class="pl-2">Loading robots...</span>
          </span>
        </button>
        <div class="dropdown-menu" id="robots"></div>
      </div>
    </div>

    <!-- Breadcrumb + New -->
    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="new-btn-wrap" id="newMenuWrap">
        <button class="btn-new" onclick="toggleNewMenu()">&#43; New</button>
        <div class="new-menu-dropdown" id="newMenuDropdown">
          <button onclick="createFolder()">&#128193; New Folder</button>
          <button onclick="createClass()">&#127979; New Class</button>
        </div>
      </div>
    </div>

    <div class="library-grid" id="libraryGrid"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗂️</div>
      <div>No classes yet.</div>
      <div>Click "+ New" to create a folder or your first class.</div>
    </div>

    <div class="footer">&copy; FLEXI Educational Platform</div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  <script src="scripts/config.js"></script>
  <script src="../databasejs/scripts/database.js"></script>
  <script src="scripts/library.js"></script>
</body>
</html>
